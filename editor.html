<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mettukudam Editor</title>
</head>
<body>
  <script>
    const target = window.location.hostname.endsWith("github.io")
      ? "index.html"
      : "index.html?mode=edit";
    window.location.replace(target);
  </script>
  <p>Redirecting to <a href="index.html?mode=edit">index.html?mode=edit</a>...</p>
</body>
</html>
